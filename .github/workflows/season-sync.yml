name: Saison-Sync (Liga + SpielerPlus)

on:
  schedule:
    # Täglich 05:30 UTC (07:30 DE) — Liga-Ergebnisse vom Wochenende + Beteiligung vom Vorabend
    - cron: '30 5 * * *'
  workflow_dispatch: {}

jobs:
  liga:
    name: Liga-Ergebnisse & Tabellen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Liga-Daten holen (data/liga.json)
        run: node sync-liga.js
      - name: Änderungen committen (nur wenn neue Daten)
        run: |
          git config user.name "liga-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet data/liga.json; then
            git add data/liga.json
            git commit -m "Liga-Daten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Keine Änderungen."
          fi

  spielerplus:
    name: SpielerPlus Trainingsbeteiligung
    runs-on: ubuntu-latest
    # Ohne Limit lief ein hängender Install-Step am 19.08. 26 min weiter (Default waere 6 h)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright installieren
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          npm install --no-audit --no-fund playwright
          # --with-deps blieb am 19.08. mehrfach in der apt-Phase haengen → hart begrenzen,
          # danach Fallback ohne System-Deps (ubuntu-latest bringt die Chromium-Libs mit)
          if ! timeout 360 npx playwright install --with-deps chromium; then
            echo "::warning::playwright install --with-deps fehlgeschlagen/timeout — Fallback ohne apt-Deps"
            timeout 300 npx playwright install chromium
          fi
      - name: Beteiligung scrapen und nach Firebase schreiben
        env:
          SPIELERPLUS_EMAIL: ${{ secrets.SPIELERPLUS_EMAIL }}
          SPIELERPLUS_PASSWORD: ${{ secrets.SPIELERPLUS_PASSWORD }}
          SP_BROWSER_CHANNEL: chromium
          SEASON_START: '2026-07-22'
        run: node scrape-spielerplus.js --participation-only
